upstream web {
  # One of these is always being replaced during a rollout. A container that is
  # not answering is taken out for five seconds rather than tried on every
  # request, and keepalive stops a new connection per proxied request.
  server web-1:3000 max_fails=2 fail_timeout=5s;
  server web-2:3000 max_fails=2 fail_timeout=5s;
  keepalive 32;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;

server {
  listen 80;
  server_name _;

  # Traefik terminates TLS and is the only thing in front, so the client address
  # comes from the header it sets rather than from the connection.
  real_ip_header X-Forwarded-For;
  set_real_ip_from 172.16.0.0/12;
  real_ip_recursive on;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  # A container going down mid request is the normal case here, not a fault, so
  # the next one gets the request rather than the reader getting the error.
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;
  proxy_connect_timeout 2s;

  client_max_body_size 2m;

  location / {
    proxy_pass http://web;
  }

  # Hashed filenames, so the answer for one never changes.
  location /assets/ {
    proxy_pass http://web;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
