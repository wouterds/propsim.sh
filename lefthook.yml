post-merge:
  parallel: true
  commands:
    dependencies:
      run: npm install --package-lock-only

post-checkout:
  parallel: true
  # A rebase is a checkout per commit. Rewriting the lock mid-rebase leaves the
  # tree dirty and the commit that owns the change lands empty.
  skip:
    - rebase
    - merge
  commands:
    dependencies:
      run: npm install --package-lock-only

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      run: npx biome check --no-errors-on-unmatched {staged_files}

commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
