version: 2

# Without a prefix Dependabot writes "⬆️ Bump x from a to b". `scope` appends
# (deps) / (deps-dev). Every ecosystem uses chore, so the log reads one way.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Each app pins its own base image, so each one has to be listed.
  - package-ecosystem: "docker"
    directories:
      - "/apps/web"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/web"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
